baseURL: "https://telomere385.github.io/"
title: "Telomere385"
theme: "PaperMod"
pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "EN"
    weight: 1
    title: "Telomere385"
    params:
      profileMode:
        enabled: true
        title: "Telomere385"
        subtitle: "Researcher · Developer · Thinker"
        imageUrl: "/img/avatar.png"
        imageTitle: "avatar"
        buttons:
          - name: Research
            url: /research/
          - name: Blog
            url: /posts/
    menu:
      main:
        - name: About
          url: /about/
          weight: 1
        - name: Research
          url: /research/
          weight: 2
        - name: Lab Notes
          url: /lab-notes/
          weight: 3
        - name: Blog
          url: /posts/
          weight: 4

  zh:
    languageName: "中文"
    weight: 2
    title: "Telomere385"
    params:
      profileMode:
        enabled: true
        title: "Telomere385"
        subtitle: "研究者 · 开发者 · 思考者"
        imageUrl: "/img/avatar.png"
        imageTitle: "头像"
        buttons:
          - name: 研究
            url: /zh/research/
          - name: 博客
            url: /zh/posts/
    menu:
      main:
        - name: 关于
          url: /zh/about/
          weight: 1
        - name: 研究
          url: /zh/research/
          weight: 2
        - name: 实验笔记
          url: /zh/lab-notes/
          weight: 3
        - name: 技术博客
          url: /zh/posts/
          weight: 4

params:
  env: production
  author: Telomere385
  description: "Personal site of Telomere385 — research, notes, and writing."
  keywords: [research, blog, notes, technology]

  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    # disableHLJS: true  # uncomment to use custom syntax highlighting
    favicon: "/img/favicon.ico"
    favicon16x16: "/img/favicon-16x16.png"
    favicon32x32: "/img/favicon-32x32.png"
    apple_touch_icon: "/img/apple-touch-icon.png"
    safari_pinned_tab: "/img/safari-pinned-tab.svg"

  label:
    text: "Telomere385"
    icon: /img/favicon.ico
    iconHeight: 35

  socialIcons:
    - name: github
      url: "https://github.com/Telomere385"
    - name: email
      url: "mailto:wangruining385@gmail.com"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    URL: "https://github.com/Telomere385/Telomere385.github.io/tree/main/content"
    Text: "Suggest Edit"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: true
    lineNumbersInTable: true

minify:
  disableXML: true
  minifyOutput: true
